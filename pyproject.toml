[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "college-notes-qa"
version = "0.1.0"
description = "RAG question-answering assistant for college lecture notes and course material"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dense = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
notes-qa = "notes_qa.cli:main"

[tool.setuptools]
packages = ["notes_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
